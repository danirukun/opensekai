[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "crates/contracts", "crates/evaluation"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"

[workspace.dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-build = { version = "=2.7.1", features = [] }
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = [] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
rand = { version = "=0.10.3", features = [] }
reqwest = { version = "=0.13.5", features = ["json"] }
tokio-tungstenite = { version = "=0.30.0", features = [] }
png = { version = "=0.18.1", features = [] }
sha2 = { version = "=0.11.0", features = [] }
base64 = { version = "=0.23.1", features = [] }
futures-util = { version = "=0.3.34", features = [] }
tempfile = { version = "=3.27.0", features = [] }
url = { version = "=2.5.8", features = [] }
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }
percent-encoding = { version = "=2.3.2", features = [] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
